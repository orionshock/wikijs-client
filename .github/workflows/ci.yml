name: ci

on:
  push:
    paths:
      - 'pyproject.toml'
      - 'src/**/*.py'
      - 'tests/**/*.py'
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'src/**/*.py'
      - 'tests/**/*.py'

jobs:
  test-build-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Build package
        run: |
          rm -rf dist
          python -m build --sdist --wheel

      - name: Install built wheel in clean virtualenv
        run: |
          python -m venv .smoke-venv
          . .smoke-venv/bin/activate
          python -m pip install --upgrade pip
          wheel_path=$(find dist -maxdepth 1 -name '*.whl' | head -n 1)
          test -n "$wheel_path"
          pip install "$wheel_path"

      - name: Run CLI smoke checks from built wheel
        run: |
          . .smoke-venv/bin/activate
          wikijs-client --help
          wikijs-client list --help
          wikijs-client search --help
          wikijs-client exists --help
          wikijs-client get --help
          wikijs-client upsert --help
          wikijs-client move --help
          wikijs-client delete --help
          python -c "import wikijs_client; print(wikijs_client.__version__)"
