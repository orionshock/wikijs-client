[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wikijs-client"
version = "0.1.0"
description = "A small Python CLI and library for practical Wiki.js GraphQL page operations"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "requests>=2.31,<3",
]
authors = [
  { name = "Orion Shockman", email = "orionshock@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["wikijs", "graphql", "cli", "wiki"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/orionshock/wikijs-client"
Repository = "https://github.com/orionshock/wikijs-client"
Issues = "https://github.com/orionshock/wikijs-client/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "twine>=5,<6",
]

[project.scripts]
wikijs-client = "wikijs_client.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
