[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wikijs-client"
version = "0.1.0"
description = "A small Python CLI and library for practical Wiki.js GraphQL page operations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31,<3",
]
authors = [
  { name = "NewCapricaOpenClaw" }
]
license = { text = "MIT" }
keywords = ["wikijs", "graphql", "cli", "wiki"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
wikijs-client = "wikijs_client.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
